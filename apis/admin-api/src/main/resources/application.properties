spring.application.name=admin

spring.datasource.url=${ADMIN_DB_URL}
spring.datasource.username=${ADMIN_DB_USERNAME}
spring.datasource.password=${ADMIN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# UNIX-03 내부 서비스 주소. 실제 context path가 확정되면 환경변수만 변경합니다.
services.booking.base-url=${BOOKING_SERVICE_URL:http://127.0.0.1:8080/booking}
services.crew.base-url=${CREW_SERVICE_URL:http://127.0.0.1:8080/crew}
services.partner.base-url=${PARTNER_SERVICE_URL:http://partner.airlab.test/admin-api}

# 교육용 웹 취약점 실습 기능입니다. 기본값은 비활성화이며, 실제 배포 시
# ADMIN_LAB_ENABLED=true를 명시한 경우에만 /api/admin/lab/**가 등록됩니다.
admin.lab.enabled=${ADMIN_LAB_ENABLED:false}
